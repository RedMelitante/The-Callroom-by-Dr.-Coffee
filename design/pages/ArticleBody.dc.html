<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blog post template — The Callroom</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<article style="width: 100%; font-family: 'DM Sans', system-ui, sans-serif; color: #2B1A12; background: #F7F0E4; padding: clamp(28px, 5vw, 64px) clamp(20px, 4vw, 40px) clamp(56px, 7vw, 96px); box-sizing: border-box">
<div style="max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px">

<header style="max-width: 760px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 16px">
<nav aria-label="Breadcrumb" style="font-size: 14px; display: flex; gap: 8px"><a href="Blog.dc.html" style="color: #8A4F17">Coffee Blog CDO</a><span aria-hidden="true">/</span><span style="color: #5A3A28">[Category]</span></nav>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: clamp(38px, 5.4vw, 64px); letter-spacing: -0.03em; line-height: 1.02">[Post title]</h1>
<p style="margin: 0; font-size: 20px; line-height: 1.55; color: #5A3A28">[One- or two-sentence summary of the post.]</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; font-size: 14px; color: #5A3A28; padding-top: 8px; border-top: 1px solid #E3D5BF">
<img src="../assets/images/logo.webp" alt="" style="width: 40px; height: 40px; border-radius: 999px; display: block; flex: none">
<span><strong style="color: #2B1A12">The Callroom team</strong> · [Date] · [X] min read</span>
</div>
</header>

<div style="aspect-ratio: 21 / 9; min-height: 200px; border-radius: 28px; background: #E9DCC6; border: 1.5px dashed #B79C7A; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #6B4E36">[Featured image]</div>

<div style="max-width: 760px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 22px; font-size: 18px; line-height: 1.75; color: #3A261B">
<p style="margin: 0">[Opening paragraph.]</p>
<h2 style="margin: 12px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.02em; line-height: 1.15; color: #2B1A12">[Section heading]</h2>
<p style="margin: 0">[Body text.]</p>
<blockquote style="margin: 8px 0; padding: 24px 28px; border-radius: 20px; background: #2B1A12; color: #F7F0E4; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: clamp(24px, 3vw, 32px); line-height: 1.25; letter-spacing: -0.015em">[Pull quote]</blockquote>
<aside style="border: 1.5px dashed #B79C7A; border-radius: 18px; background: #FFFBF4; padding: 20px 22px; display: flex; flex-direction: column; gap: 8px; font-size: 16px; line-height: 1.6">
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #2F6F6A; font-weight: 600">Rx · Barista's note</span>
<span style="color: #3A261B">[Optional tip or callout.]</span>
</aside>
<div style="display: flex; flex-wrap: wrap; gap: 12px; padding-top: 12px">
<a href="Menu.dc.html" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 24px; border-radius: 999px; background: #2B1A12; color: #F7F0E4; font-weight: 700; font-size: 16px; text-decoration: none">Order Ahead</a>
<a href="Blog.dc.html" style="display: inline-flex; align-items: center; min-height: 52px; padding: 0 20px; border-radius: 999px; border: 1.5px solid #D6C3A5; color: #2B1A12; font-weight: 700; font-size: 16px; text-decoration: none">Back to blog</a>
</div>
</div>

</div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1700}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
