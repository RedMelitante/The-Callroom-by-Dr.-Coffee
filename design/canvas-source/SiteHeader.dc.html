<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site header — The Callroom</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=DM+Sans:opsz,wght@9..40,400..700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="position: sticky; top: 0; z-index: 20; width: 100%; background: #F7F0E4; border-bottom: 1px solid #E3D5BF; font-family: 'DM Sans', system-ui, sans-serif; color: #2B1A12">
<div style="max-width: 1320px; margin: 0 auto; min-height: 76px; padding: 0 clamp(20px, 3vw, 40px); box-sizing: border-box; display: flex; align-items: center; gap: 16px">
<a href="Home.dc.html" aria-label="The Callroom by Dr. Coffee — home" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #2B1A12; flex: none">
<img src="/_blob/e5b1d1cc6559e8afd24ff481a39c89ce" alt="" style="width: 48px; height: 48px; border-radius: 999px; display: block; flex: none">
<span style="display: flex; flex-direction: column; line-height: 1"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em">The Callroom</span><span style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: #2F6F6A; margin-top: 3px">by Dr. Coffee</span></span>
</a>
<nav aria-label="Main" style="display: flex; gap: 2px; flex: 1 1 auto; justify-content: center; min-width: 0">
<sc-for list="{{links}}" as="l" hint-placeholder-count="6">
<a href="{{l.href}}" style="padding: 10px 11px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 15px; white-space: nowrap; color: #2B1A12; background: {{l.bg}}">{{l.label}}</a>
</sc-for>
</nav>
<span style="display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px; background: #DCEBE8; color: #1F4F4B; font-weight: 600; font-size: 13px; white-space: nowrap"><span style="width: 8px; height: 8px; border-radius: 999px; background: #2F8F6A"></span>Open · until 6PM</span>
<a href="Menu.dc.html" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; background: #2B1A12; color: #F7F0E4; font-weight: 700; font-size: 15px; text-decoration: none; white-space: nowrap">Order Ahead</a>
<a href="Account.dc.html" aria-label="My account" style="flex: none; width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid #D6C3A5; display: inline-flex; align-items: center; justify-content: center; color: #2B1A12"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></a>
<a href="Cart.dc.html" aria-label="Cart, 2 items" style="flex: none; position: relative; width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid #D6C3A5; display: inline-flex; align-items: center; justify-content: center; color: #2B1A12">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
<span style="position: absolute; top: -4px; right: -4px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #E0A458; color: #2B1A12; font-weight: 800; font-size: 11px; display: flex; align-items: center; justify-content: center">2</span>
</a>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":null},"$preview":{"width":1440,"height":76}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'Home';
const items = [
['Our Menu', 'OurMenu.dc.html', ['OurMenu', 'Menu', 'Product', 'Cart', 'Checkout', 'Confirmation']],
['Coffee Cart', 'Events.dc.html', ['Events']],
['About', 'About.dc.html', ['About']],
['Visit Us', 'Visit.dc.html', ['Visit']],
['FAQ', 'Faq.dc.html', ['Faq']],
['Blog', 'Blog.dc.html', ['Blog', 'Article']]
];
return { links: items.map(([label, href, keys]) => ({ label, href, bg: keys.includes(a) ? '#EFE4D2' : 'transparent' })) };
}
}
</script>
</body>
</html>
