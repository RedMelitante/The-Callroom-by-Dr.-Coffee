<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile bottom nav — The Callroom</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Quick" style="position: sticky; bottom: 0; z-index: 30; width: 100%; height: 76px; box-sizing: border-box; padding: 8px 8px 12px; background: #2B1A12; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; font-family: 'DM Sans', system-ui, sans-serif; border-radius: 22px 22px 0 0">
<sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
<a href="{{t.href}}" style="position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; border-radius: 14px; text-decoration: none; color: {{t.fg}}; background: {{t.bg}}; font-size: 12px; font-weight: 700">
<sc-if value="{{t.home}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7v9H4z"/><path d="M10 20v-6h4v6"/></svg></sc-if>
<sc-if value="{{t.menu}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h13v5a6 6 0 0 1-6 6h-1a6 6 0 0 1-6-6z"/><path d="M17 10h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 2v3M12 2v3"/></svg></sc-if>
<sc-if value="{{t.cart}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span style="position: absolute; top: 4px; left: 54%; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #E0A458; color: #2B1A12; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center">2</span></sc-if>
<sc-if value="{{t.events}}" hint-placeholder-val="{{ false }}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></sc-if>
<span>{{t.label}}</span>
</a>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":null},"$preview":{"width":390,"height":76}}'>
class Component extends DCLogic {
renderVals() {
const a = this.props.active ?? 'Home';
const defs = [
{ key: 'home', label: 'Home', href: 'Home-Mobile.dc.html', on: ['Home', 'About', 'Visit', 'Faq', 'Blog', 'Article'] },
{ key: 'menu', label: 'Menu', href: 'OurMenu-Mobile.dc.html', on: ['OurMenu', 'Menu', 'Product'] },
{ key: 'cart', label: 'Cart', href: 'Cart-Mobile.dc.html', on: ['Cart', 'Checkout', 'Confirmation'] },
{ key: 'events', label: 'Events', href: 'Events-Mobile.dc.html', on: ['Events'] }
];
return { tabs: defs.map((d) => {
const act = d.on.includes(a);
return { label: d.label, href: d.href, home: d.key === 'home', menu: d.key === 'menu', cart: d.key === 'cart', events: d.key === 'events', fg: act ? '#2B1A12' : '#EADBC4', bg: act ? '#E0A458' : 'transparent' };
}) };
}
}
</script>
</body>
</html>
